<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact page• Discover Colombia</title>
    <meta name="description" content="Contact Discover Colombia to share your travel interests and choose a Colombian destination to explore.">
    <meta name="author" content="Karen Natalia Gaviria Mariaca">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/larger.css">

    <script src="scripts/main.js" defer></script>
</head>

<body>

    <header>
        <h1>Discover Colombia</h1>
        <p>Nature • Culture • Travel</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="destinations.html">Destinations</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

    <main>
        <section class="page-title">
            <h2>Contact us</h2>
            <p>
                We'd love to hear from you! Send us your questions,
                travel ideas, or recommendations about Colombia.
            </p>
        </section>

        <section class="contact-form">

            <form method="get" action="contact.html">

            <div>
                <label for="name">Full Name<span class="required">*</span></label>
            
                <input type="text" id="name" name="name" autocomplete="name" required>
            </div>

            <div>
                <label for="email">Email<span class="required">*</span></label>
            
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>

            <div>
                <label for="favoriteDestination">Favorite Destination</label>
                
                <select id="favoriteDestination" name="favoriteDestination">
                    <option value="">Select a Destination</option>
                </select>
            </div>

            <div>
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6"></textarea>
            </div>

            <div>            
                <input type="submit" value="Send Message">
            </div>

            </form>

            <p id="confirmationMessage"></p>

        </section>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Karen Natalia Gaviria Mariaca • Colombia </p>
        <p id="lastModified"></p>
        <p><a href="references.html">References</a></p>
    </footer>
</body>
</html>
