<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 - Review page form</title>
    <meta name="description" content="Product review page form where users can rate a product, select useful features, write comments, and submit their feedback">
    <meta name="author" content="Karen Natalia Gaviria Mariaca">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <div>
                <label for="productName">Product Name</label>

                <select id="productName" name="productName" required>
                    <option value="" selected disabled>Select a Product ...</option>
                </select>
            </div>

            <div>
                <p>Overall Rating</p>
                    <input type="radio" id="one" name="rating" value="1" required>
                    <label for="one">⭐</label>

                    <input type="radio" id="two" name="rating" value="2" required>
                    <label for="two">⭐⭐</label>

                    <input type="radio" id="three" name="rating" value="3" required>
                    <label for="three">⭐⭐⭐</label>

                    <input type="radio" id="four" name="rating" value="4" required>
                    <label for="four">⭐⭐⭐⭐</label>
                    
                    <input type="radio" id="five" name="rating" value="5" required>
                    <label for="five">⭐⭐⭐⭐⭐</label>
            </div>

            <div>
                <label for="installationDate">Date of installation</label>
                <input type="date" id="installationDate" name="installationDate" required>
            </div>

            <div>
            <input type="checkbox" id="durability" name="features" value="Durability"> 
            <label for="durability">Durability</label>

            <input type="checkbox" id="easeOfUse" name="features" value="Ease of Use"> 
            <label for="easeOfUse">Ease of Use</label>

            <input type="checkbox" id="performance" name="features" value="Performance"> 
            <label for="performance">Performance</label>

            <input type="checkbox" id="design" name="features" value="Design"> 
            <label for="design">Design</label>
            </div>

            <div>
                <label for="review">Written Review (Optional)</label>
                <textarea id="review" name="review" rows="5" cols="40"></textarea>
            </div>

            <div>
                <label for="userName">Your Name (Optional)</label>
                <input type="text" id="userName" name="userName">
            </div>

            <div>
                <input type="submit" value="Post Review">
            </div>
        </form>

    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Karen Natalia Gaviria Mariaca - Colombia </p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
